<header class="navbar">
    <div class="container navbar-inner">
        <a href="{% url 'home' %}" class="navbar-brand">BuyNest</a>

        <button class="navbar-toggle" id="navToggle" aria-label="Toggle navigation">&#9776;</button>

        <form class="navbar-search" action="{% url 'products:search' %}" method="get">
            <input type="search" name="q" placeholder="Search products..." aria-label="Search products">
            <button type="submit">Search</button>
        </form>

        <nav class="navbar-links" id="navLinks">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'products:list' %}">Products</a>
            {% if user.is_authenticated %}
            <a href="{% url 'authentication:profile' %}">My Profile</a>
            <a href="{% url 'orders:history' %}">My Orders</a>
            <a href="{% url 'cart:view' %}">Cart</a>
            {% if user.is_staff %}
            <a href="{% url 'dashboard:home' %}">Dashboard</a>
            {% endif %}
            <form action="{% url 'authentication:logout' %}" method="post" class="inline-form">
                {% csrf_token %}
                <button type="submit" class="link-button">Logout</button>
            </form>
            {% else %}
            <a href="{% url 'authentication:login' %}">Login</a>
            <a href="{% url 'authentication:register' %}">Register</a>
            <a href="{% url 'cart:view' %}">Cart</a>
            {% endif %}
        </nav>
    </div>
</header>
