{% extends "dashboard/base_dashboard.html" %}
{% block title %}Delete Product - Dashboard{% endblock %}
{% block dashboard_content %}
<h1>Delete Product</h1>
<p>Are you sure you want to delete <strong>{{ product.name }}</strong>? This cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete Product</button>
    <a href="{% url 'dashboard:product_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
